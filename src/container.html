<!DOCTYPE html>
<html lang="en">
<head>
	<link href="../../ux-core/css/app.css" rel="stylesheet">
	<link href="../right-pane.css" rel="stylesheet">
	<link href="../../notifications/css/notifications.css" rel="stylesheet">
	<!--styleSheets--><link href="app://(.)" rel="stylesheet"><!--end-->
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link href="/favicon.png" rel="icon">
	<!--manifest?-->
	<link href="/favicon.png" rel="apple-touch-icon">
	<link href="/manifest.json" rel="manifest">
	<meta content="yes" name="apple-mobile-web-app-capable">
	<meta content="default" name="apple-mobile-web-app-status-bar-style">
	<!--end-->
	<script type="importmap"> { "imports": { "@itrocks/": "/@itrocks/" } } </script>
	<script src="../../framework/app.js" type="module"></script>
	<script src="../container.js" type="module"></script>
	<!--scripts--><script src="app://(.)" type="module"></script><!--end-->
	<title>it.rocks application</title>
</head>
<body>

	<header>
		<div class="main logo"></div>
	</header>

	<!--session.user-->
	<nav class="app menu">
		<form autocomplete="off" name="global-search">
			<label for="global-search">Global search</label>
			<input id="global-search" name="global-search" placeholder="global search">
		</form>
		<div class="authenticated user">
			<div class="name">{login}</div>
			<a href="/user/logout">Log out</a>
		</div>
		<!--.menu-->{../../menu/cjs/menu.html}<!--end-->
	</nav>
	<!--end-->

	<button class="collapse">collapse</button>

	<ol class="breadcrumb">
		<li class="home"><a href="/">Home</a></li>
	</ol>

	<main>
		{content}
	</main>

	<ol id="notifications"></ol>

	<div class="right-pane-dock"></div>
	<aside class="right-pane" aria-labelledby="right-pane-title" hidden tabindex="-1">
		<div aria-label="Resize right pane" aria-orientation="vertical" class="right-pane-resize" role="separator"
			tabindex="0"></div>
		<header class="right-pane-tabs">
			<button aria-controls="right-pane-content" aria-expanded="false" class="right-pane-toggle" hidden
				type="button"><span aria-hidden="true">‹</span><span class="right-pane-label">Open pane</span></button>
			<button aria-controls="right-pane-content" aria-current="page" class="right-pane-tab" type="button"></button>
		</header>
		<div class="right-pane-title-bar">
			<h2 id="right-pane-title"></h2>
		</div>
		<div id="right-pane-content"></div>
	</aside>

</body>
</html>
